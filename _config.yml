# Setup
title: -7's website

# Gems
plugins:
  - jekyll-gist
  - jekyll-paginate
  - jekyll-seo-tag

# Optimize Jekyll
exclude:
  - .editorconfig
  - .git
  - .jekyll-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE.md
  - README.md
  - _pages/tetris_explained/resources/motion_canvas

sass:
  sass_dir: _sass
  style: compressed

collections:
  pages:
    output: true
    permalink: /:path:output_ext
